{% extends 'base.html' %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card card-custom p-4">
                <h3 class="fw-bold text-center text-primary mb-4">Patient Medical Registration Form</h3>
                
                <form action="/create" method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Patient Name / मरीज का नाम</label>
                        <input type="text" name="patient_name" class="form-control" required>
                    </div>

                    <!-- Disease Name in 3 Languages -->
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <label class="form-label">Disease (English)</label>
                            <input type="text" name="disease_en" class="form-control" placeholder="e.g. Heart Surgery" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">बीमारी (हिंदी)</label>
                            <input type="text" name="disease_hi" class="form-control" placeholder="उदा. दिल की सर्जरी">
                        </div>
                        <div class="col-md-4">
                            <label class="form-label rtl-text d-block">بیماری (اردو)</label>
                            <input type="text" name="disease_ur" class="form-control rtl-text" placeholder="مثال: دل کی سرجری">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Required Target Amount (₹ / $)</label>
                        <input type="number" name="target_amount" class="form-control" placeholder="100000" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Full Problem Details (विवरण)</label>
                        <textarea name="description" class="form-control" rows="3" required></textarea>
                    </div>

                    <hr>
                    <h5 class="fw-bold text-secondary">Bank Details (For Direct Money Receive)</h5>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <input type="text" name="account_holder" class="form-control" placeholder="Account Holder Name" required>
                        </div>
                        <div class="col-md-6">
                            <input type="text" name="account_number" class="form-control" placeholder="Account Number" required>
                        </div>
                        <div class="col-md-6">
                            <input type="text" name="ifsc_code" class="form-control" placeholder="IFSC Code" required>
                        </div>
                        <div class="col-md-6">
                            <input type="text" name="upi_id" class="form-control" placeholder="UPI ID (Paytm/PhonePe)">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Upload Medical Bill / Hospital Prescription</label>
                        <input type="file" name="document" class="form-control" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Submit Campaign</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
